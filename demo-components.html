<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Design Components Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..900&family=Roboto+Serif:opsz,wght@8..144,100..900&display=swap" rel="stylesheet">
    <script type="module">
        // Import Material Design components
        import '@material/web/button/filled-button.js';
        import '@material/web/button/outlined-button.js';
        import '@material/web/button/text-button.js';
        import '@material/web/checkbox/checkbox.js';
        import '@material/web/switch/switch.js';
        import '@material/web/textfield/filled-text-field.js';
        import '@material/web/textfield/outlined-text-field.js';
        import '@material/web/radio/radio.js';
        import '@material/web/icon/icon.js';
        import '@material/web/progress/linear-progress.js';
    </script>
    <style>
        :root {
            --md-sys-color-primary: #FF4081;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-surface: #1E1E2F;
            --md-sys-color-background: #13132B;
            --md-sys-color-on-surface: #FFFFFF;
            --md-sys-color-secondary: #00E5FF;
            --md-sys-color-on-secondary: #000000;
        }

        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Roboto Flex', sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
        }

        .demo-section {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background-color: var(--md-sys-color-surface);
            border-radius: 8px;
        }

        h2 {
            color: var(--md-sys-color-primary);
            margin-bottom: 1.5rem;
            font-family: 'Roboto Serif', serif;
        }

        .component-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .progress-demo {
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <div class="demo-section">
        <h2>1. Button Variants</h2>
        <div class="component-row">
            <md-filled-button>Filled Button</md-filled-button>
            <md-outlined-button>Outlined Button</md-outlined-button>
            <md-text-button>Text Button</md-text-button>
        </div>

        <h2>2. Text Fields</h2>
        <div class="component-row">
            <md-filled-text-field 
                label="Filled Text Field"
                placeholder="Enter text here"
                helper="Helper text">
            </md-filled-text-field>
            <md-outlined-text-field 
                label="Outlined Text Field"
                placeholder="Enter text here"
                helper="Helper text">
            </md-outlined-text-field>
        </div>

        <h2>3. Selection Controls</h2>
        <div class="component-row">
            <md-checkbox touch-target="wrapper"></md-checkbox>
            <label>Checkbox</label>
            <md-switch></md-switch>
            <label>Switch</label>
            <div style="display: flex; gap: 1rem;">
                <md-radio name="group1"></md-radio>
                <md-radio name="group1"></md-radio>
                <md-radio name="group1"></md-radio>
            </div>
            <label>Radio Group</label>
        </div>

        <h2>4. Progress Indicators</h2>
        <div class="progress-demo">
            <md-linear-progress value="0.6"></md-linear-progress>
        </div>

        <h2>5. Interactive Form</h2>
        <form id="demoForm" onsubmit="event.preventDefault(); alert('Form submitted!');">
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <md-outlined-text-field
                    label="Username"
                    required
                    pattern="[A-Za-z0-9]+"
                    error-text="Username must contain only letters and numbers">
                </md-outlined-text-field>
                
                <md-outlined-text-field
                    label="Email"
                    type="email"
                    required
                    error-text="Please enter a valid email">
                </md-outlined-text-field>

                <div class="component-row">
                    <md-checkbox required></md-checkbox>
                    <label>I agree to the terms</label>
                </div>

                <div class="component-row">
                    <md-filled-button type="submit">Submit</md-filled-button>
                    <md-outlined-button type="reset">Reset</md-outlined-button>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Add some interactivity
        document.querySelectorAll('md-switch').forEach(switchEl => {
            switchEl.addEventListener('change', () => {
                console.log('Switch toggled:', switchEl.selected);
            });
        });

        document.querySelectorAll('md-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                console.log('Checkbox changed:', checkbox.checked);
            });
        });

        document.querySelectorAll('md-radio').forEach(radio => {
            radio.addEventListener('change', () => {
                console.log('Radio selected:', radio.checked);
            });
        });

        // Animate progress bar
        const progress = document.querySelector('md-linear-progress');
        let value = 0;
        setInterval(() => {
            value = (value + 0.1) % 1;
            progress.value = value;
        }, 1000);
    </script>
</body>
</html>
